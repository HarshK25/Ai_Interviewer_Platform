<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Interviewer Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a12;
    --bg2: #0f0f1e;
    --bg3: #13132a;
    --card: rgba(255,255,255,0.04);
    --card-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-active: rgba(99,102,241,0.5);
    --primary: #6366f1;
    --primary-light: #818cf8;
    --primary-dark: #4f46e5;
    --secondary: #06b6d4;
    --accent: #f472b6;
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-faint: #475569;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 25px 50px rgba(0,0,0,0.5);
    --glow: 0 0 40px rgba(99,102,241,0.15);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(99,102,241,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(6,182,212,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 50% 50%, rgba(244,114,182,0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  #root { position: relative; z-index: 1; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--primary-dark); border-radius: 3px; }

  /* Navbar */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,18,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .navbar-brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.2rem; font-weight: 800; letter-spacing: -0.5px;
    color: var(--text); text-decoration: none;
  }
  .navbar-brand .logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; box-shadow: 0 0 20px rgba(99,102,241,0.4);
  }
  .navbar-nav { display: flex; align-items: center; gap: 0.5rem; }
  .nav-btn {
    background: none; border: none; cursor: pointer;
    padding: 8px 16px; border-radius: 8px;
    color: var(--text-muted); font-size: 0.875rem; font-weight: 500;
    transition: all 0.2s; font-family: inherit;
  }
  .nav-btn:hover { color: var(--text); background: var(--card); }
  .nav-btn.active { color: var(--primary-light); }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white; border: none; cursor: pointer;
    padding: 9px 20px; border-radius: 8px;
    font-size: 0.875rem; font-weight: 600;
    transition: all 0.2s; font-family: inherit;
    box-shadow: 0 4px 15px rgba(99,102,241,0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: var(--card); border: 1px solid var(--border); cursor: pointer;
    padding: 9px 20px; border-radius: 8px; color: var(--text);
    font-size: 0.875rem; font-weight: 500; transition: all 0.2s; font-family: inherit;
  }
  .btn-secondary:hover { background: var(--card-hover); border-color: var(--border-active); }
  .btn-danger {
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); cursor: pointer;
    padding: 9px 20px; border-radius: 8px; color: #fca5a5;
    font-size: 0.875rem; font-weight: 500; transition: all 0.2s; font-family: inherit;
  }
  .btn-danger:hover { background: rgba(239,68,68,0.2); }

  /* Cards */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.5rem;
    transition: all 0.3s;
  }
  .card:hover { background: var(--card-hover); border-color: var(--border-active); box-shadow: var(--glow); }
  .glass {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  /* Page layout */
  .page { min-height: calc(100vh - 64px); padding: 2rem; max-width: 1200px; margin: 0 auto; }
  .page-wide { min-height: calc(100vh - 64px); padding: 2rem; max-width: 1400px; margin: 0 auto; }

  /* Hero */
  .hero {
    text-align: center; padding: 5rem 2rem 3rem;
    max-width: 800px; margin: 0 auto;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.3);
    border-radius: 100px; padding: 6px 16px; font-size: 0.8rem;
    color: var(--primary-light); font-weight: 600; margin-bottom: 2rem;
    animation: fadeInDown 0.6s ease;
  }
  .hero h1 {
    font-size: clamp(2.5rem, 5vw, 4rem);
    font-weight: 900; letter-spacing: -2px; line-height: 1.1;
    margin-bottom: 1.5rem;
    background: linear-gradient(135deg, #fff 0%, var(--primary-light) 50%, var(--secondary) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: fadeInUp 0.6s ease 0.1s both;
  }
  .hero p {
    font-size: 1.2rem; color: var(--text-muted); line-height: 1.7;
    margin-bottom: 2.5rem; animation: fadeInUp 0.6s ease 0.2s both;
  }
  .hero-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; animation: fadeInUp 0.6s ease 0.3s both; }
  .hero-btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white; border: none; cursor: pointer;
    padding: 14px 32px; border-radius: 12px;
    font-size: 1rem; font-weight: 700; font-family: inherit;
    transition: all 0.3s; box-shadow: 0 8px 30px rgba(99,102,241,0.4);
  }
  .hero-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(99,102,241,0.5); }
  .hero-btn-secondary {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); cursor: pointer;
    padding: 14px 32px; border-radius: 12px; color: var(--text);
    font-size: 1rem; font-weight: 600; font-family: inherit; transition: all 0.3s;
  }
  .hero-btn-secondary:hover { background: rgba(255,255,255,0.08); border-color: var(--border-active); }

  /* Feature grid */
  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 4rem; }
  .feature-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 2rem; transition: all 0.3s; cursor: default;
    animation: fadeInUp 0.5s ease both;
  }
  .feature-card:hover { transform: translateY(-4px); border-color: var(--border-active); box-shadow: var(--glow); }
  .feature-icon {
    width: 52px; height: 52px; border-radius: 14px; margin-bottom: 1.2rem;
    display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
  }
  .feature-card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.6rem; }
  .feature-card p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; }

  /* Forms */
  .form-group { margin-bottom: 1.25rem; }
  .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; }
  .form-input {
    width: 100%; padding: 11px 16px; background: rgba(255,255,255,0.05);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-size: 0.9rem; font-family: inherit;
    transition: all 0.2s; outline: none;
  }
  .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
  .form-input::placeholder { color: var(--text-faint); }
  .form-select {
    width: 100%; padding: 11px 16px; background: rgba(255,255,255,0.05);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-size: 0.9rem; font-family: inherit;
    cursor: pointer; outline: none; transition: all 0.2s;
  }
  .form-select:focus { border-color: var(--primary); }
  .form-select option { background: var(--bg3); }
  .auth-card {
    max-width: 440px; margin: 4rem auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem;
    box-shadow: var(--shadow);
  }
  .auth-card h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
  .auth-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; margin-bottom: 2rem; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.5rem; text-align: center; transition: all 0.3s;
  }
  .stat-card:hover { border-color: var(--border-active); transform: translateY(-2px); }
  .stat-value { font-size: 2.5rem; font-weight: 800; line-height: 1; margin-bottom: 0.4rem; }
  .stat-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Session cards */
  .sessions-list { display: grid; gap: 1rem; }
  .session-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.5rem; display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; transition: all 0.3s; cursor: pointer;
  }
  .session-card:hover { background: var(--card-hover); border-color: var(--border-active); }
  .session-info { flex: 1; }
  .session-role { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.3rem; }
  .session-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 1rem; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 100px; font-size: 0.75rem; font-weight: 600;
  }
  .badge-pending { background: rgba(245,158,11,0.15); color: #fcd34d; }
  .badge-active { background: rgba(16,185,129,0.15); color: #34d399; }
  .badge-completed { background: rgba(99,102,241,0.15); color: #a5b4fc; }
  .badge-aborted { background: rgba(239,68,68,0.15); color: #fca5a5; }

  /* Interview page */
  .interview-layout { display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; height: calc(100vh - 130px); }
  .interview-main { display: flex; flex-direction: column; gap: 1.5rem; overflow: hidden; }
  .interview-sidebar { display: flex; flex-direction: column; gap: 1.25rem; overflow-y: auto; }

  /* Camera */
  .camera-box {
    position: relative; background: #000; border-radius: var(--radius);
    border: 1px solid var(--border); overflow: hidden;
    aspect-ratio: 16/9; flex-shrink: 0;
  }
  .camera-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camera-overlay {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 1rem; display: flex; justify-content: space-between; align-items: flex-start;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
  }
  .camera-label {
    background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 100px;
    padding: 4px 12px; font-size: 0.75rem; font-weight: 600; color: white;
    display: flex; align-items: center; gap: 6px;
  }
  .rec-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--error); animation: pulse 1s infinite; }
  .camera-off {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 1rem; color: var(--text-faint);
  }
  .camera-off span { font-size: 3rem; }

  /* Question display */
  .question-box {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.75rem; flex: 1;
  }
  .question-num { font-size: 0.8rem; color: var(--primary-light); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.75rem; }
  .question-text { font-size: 1.25rem; font-weight: 600; line-height: 1.6; color: var(--text); }
  .question-type-badge {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 1rem; padding: 4px 12px; border-radius: 100px;
    font-size: 0.75rem; font-weight: 600;
    background: rgba(99,102,241,0.12); color: var(--primary-light);
    border: 1px solid rgba(99,102,241,0.2);
  }

  /* Recording controls */
  .record-controls {
    display: flex; align-items: center; gap: 1rem;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.25rem;
  }
  .record-btn {
    width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
    transition: all 0.3s; flex-shrink: 0;
  }
  .record-btn.idle {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    box-shadow: 0 4px 20px rgba(99,102,241,0.4);
  }
  .record-btn.idle:hover { transform: scale(1.05); box-shadow: 0 6px 25px rgba(99,102,241,0.5); }
  .record-btn.recording {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    box-shadow: 0 4px 20px rgba(239,68,68,0.4); animation: recordPulse 1s infinite;
  }
  .record-info { flex: 1; }
  .record-status { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.3rem; }
  .record-hint { font-size: 0.8rem; color: var(--text-muted); }

  /* Score sidebar */
  .score-card-sm {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.25rem;
  }
  .score-card-sm h4 { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1rem; }
  .score-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
  .score-label { font-size: 0.85rem; color: var(--text-muted); }
  .score-val { font-size: 0.9rem; font-weight: 700; }
  .score-bar { height: 4px; background: var(--bg3); border-radius: 2px; margin-bottom: 1rem; }
  .score-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }

  /* Upload area */
  .upload-zone {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 3rem; text-align: center; cursor: pointer; transition: all 0.3s;
    background: rgba(255,255,255,0.02);
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--primary); background: rgba(99,102,241,0.05);
  }
  .upload-icon { font-size: 3rem; margin-bottom: 1rem; }
  .upload-zone h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
  .upload-zone p { color: var(--text-muted); font-size: 0.9rem; }

  /* Progress bar */
  .progress { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .progress-bar {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    transition: width 0.5s ease;
  }

  /* Scorecard full */
  .scorecard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    border: 4px solid var(--primary); display: flex; flex-direction: column;
    align-items: center; justify-content: center; margin: 0 auto 1.5rem;
    box-shadow: 0 0 30px rgba(99,102,241,0.3);
  }
  .score-circle .big-num { font-size: 2.5rem; font-weight: 900; line-height: 1; }
  .score-circle .out-of { font-size: 0.75rem; color: var(--text-muted); }

  /* Toasts */
  .toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.75rem; }
  .toast {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem 1.25rem; min-width: 280px; max-width: 380px;
    display: flex; align-items: flex-start; gap: 0.75rem;
    box-shadow: var(--shadow); animation: slideInRight 0.3s ease;
  }
  .toast.success { border-left: 3px solid var(--success); }
  .toast.error { border-left: 3px solid var(--error); }
  .toast.info { border-left: 3px solid var(--primary); }
  .toast-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
  .toast-msg { font-size: 0.875rem; line-height: 1.5; }

  /* Divider */
  .divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .divider span { color: var(--text-faint); font-size: 0.8rem; }

  /* Spinner */
  .spinner {
    width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2);
    border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite;
    display: inline-block;
  }

  /* Section headers */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .section-title { font-size: 1.5rem; font-weight: 800; }
  .section-sub { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem; }

  /* Empty state */
  .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
  .empty-state .empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }
  .empty-state h3 { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 0.5rem; }
  .empty-state p { font-size: 0.9rem; margin-bottom: 1.5rem; }

  /* Alert */
  .alert { padding: 1rem 1.25rem; border-radius: var(--radius-sm); font-size: 0.875rem; margin-bottom: 1rem; }
  .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; }
  .alert-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); color: #6ee7b7; }
  .alert-info { background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.25); color: #a5b4fc; }

  /* Tabs */
  .tabs { display: flex; gap: 0.5rem; background: var(--bg3); padding: 4px; border-radius: 12px; margin-bottom: 2rem; width: fit-content; }
  .tab-btn {
    background: none; border: none; cursor: pointer; padding: 8px 20px; border-radius: 8px;
    color: var(--text-muted); font-size: 0.875rem; font-weight: 600; font-family: inherit; transition: all 0.2s;
  }
  .tab-btn.active { background: var(--card); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

  /* Grid helpers */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .gap-1 { gap: 0.5rem; }
  .gap-2 { gap: 1rem; }
  .gap-3 { gap: 1.5rem; }
  .mt-1 { margin-top: 0.5rem; }
  .mt-2 { margin-top: 1rem; }
  .mt-3 { margin-top: 1.5rem; }
  .mb-1 { margin-bottom: 0.5rem; }
  .mb-2 { margin-bottom: 1rem; }
  .w-full { width: 100%; }
  .text-center { text-align: center; }
  .text-sm { font-size: 0.875rem; }
  .text-xs { font-size: 0.75rem; }
  .text-muted { color: var(--text-muted); }
  .font-bold { font-weight: 700; }
  .font-semibold { font-weight: 600; }

  /* Animations */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes recordPulse { 0%, 100% { box-shadow: 0 4px 20px rgba(239,68,68,0.4); } 50% { box-shadow: 0 4px 30px rgba(239,68,68,0.7), 0 0 0 8px rgba(239,68,68,0.1); } }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

  .skeleton {
    background: linear-gradient(90deg, var(--bg3) 25%, rgba(255,255,255,0.05) 50%, var(--bg3) 75%);
    background-size: 200% 100%; animation: shimmer 1.5s infinite;
    border-radius: 6px;
  }

  @media (max-width: 768px) {

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const API = 'http://localhost:8001';

// ── API helpers ───────────────────────────────────────────────────────────────
const api = {
  async request(method, path, body, token) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(API + path, {
      method, headers,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || `Error ${res.status}`);
    return data;
  },
  async upload(path, formData, token) {
    const headers = {};
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(API + path, { method: 'POST', headers, body: formData });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || `Error ${res.status}`);
    return data;
  },
  get: (p, t) => api.request('GET', p, null, t),
  post: (p, b, t) => api.request('POST', p, b, t),
  // Login uses JSON body (not form-data)
  async login(email, password) {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || 'Login failed');
    return data; // { access_token, refresh_token, token_type }
  },
};

// ── Toast System ──────────────────────────────────────────────────────────────
function SingleToast({ t, remove }) {
  useEffect(() => {
    const timer = setTimeout(() => remove(t.id), 4000);
    return () => clearTimeout(timer);
  }, [t.id, remove]);
  return (
    <div className={`toast ${t.type}`} style={{display:'flex', alignItems:'center', gap:'0.5rem', justifyContent:'space-between'}}>
      <span className="toast-icon">{t.type === 'success' ? '✅' : t.type === 'error' ? '❌' : 'ℹ️'}</span>
      <span className="toast-msg" style={{flex:1}}>{t.msg}</span>
      <span onClick={() => remove(t.id)} style={{marginLeft:'0.5rem', opacity:0.6, fontWeight:'bold', fontSize:'1rem', cursor:'pointer'}}>✕</span>
    </div>
  );
}
function ToastContainer({ toasts, remove }) {
  return (
    <div className="toast-container">
      {toasts.map(t => <SingleToast key={t.id} t={t} remove={remove}/>)}
    </div>
  );
}
function useToast() {
  const [toasts, setToasts] = useState([]);
  const counterRef = useRef(0);
  const add = useCallback((msg, type = 'info') => {
    const id = ++counterRef.current;
    // Keep max 3 toasts to avoid pile-up
    setToasts(p => {
      const next = [...p, { id, msg, type }];
      return next.length > 3 ? next.slice(next.length - 3) : next;
    });
  }, []);
  const remove = useCallback((id) => setToasts(p => p.filter(t => t.id !== id)), []);
  const clear = useCallback(() => setToasts([]), []);
  return { toasts, add, remove, clear };
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function DashboardPage({ token, setPage, setCurrentSession, toast }) {
  const [stats, setStats] = useState(null);
  const [sessions, setSessions] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    Promise.all([
      api.get('/dashboard/stats', token),
      api.get('/dashboard/sessions', token),
    ]).then(([s, sess]) => { setStats(s); setSessions(sess); })
      .catch(() => toast('Could not load dashboard', 'error'))
      .finally(() => setLoading(false));
  }, [token]);

  const scoreColor = (s) => {
    if (!s) return 'var(--text-muted)';
    if (s >= 8) return '#10b981';
    if (s >= 6) return '#f59e0b';
    return '#ef4444';
  };

  const statusBadge = (status) => {
    const map = { pending:'badge-pending', active:'badge-active', completed:'badge-completed', aborted:'badge-aborted' };
    const icons = { pending:'⏳', active:'🔴', completed:'✅', aborted:'🚫' };
    return <span className={`badge ${map[status]||'badge-pending'}`}>{icons[status]} {status}</span>;
  };

  if (loading) return (
    <div className="page">
      <div className="stats-grid">{[...Array(4)].map((_,i)=> <div key={i} className="stat-card"><div className="skeleton" style={{height:'60px'}}/></div>)}</div>

  );

  return (
    <div className="page">

        <div>

      </div>

        {[
          { label: 'Sessions Completed', value: stats?.total_completed_sessions ?? 0, color: '#6366f1', icon: '🎯' },
          { label: 'Average Score', value: stats?.average_overall_score ? `${stats.average_overall_score}/10` : 'N/A', color: scoreColor(stats?.average_overall_score), icon: '📊' },
          { label: 'Best Score', value: stats?.best_score ? `${stats.best_score}/10` : 'N/A', color: '#10b981', icon: '🏆' },
          { label: 'Hire Recommendations', value: stats?.hire_recommendations ?? 0, color: '#f472b6', icon: '💼' },

          <div className="stat-card" key={i}>
            <div style={{fontSize:'1.5rem', marginBottom:'0.5rem'}}>{s.icon}</div>

          <p>Upload your resume and start your first AI interview</p>
          <button className="btn-primary" onClick={() => setPage('upload')}>Upload Resume to Start</button>
        </div>

        <div className="sessions-list">
          {sessions.map(s => (
            <div className="session-card" key={s.id} onClick={() => { setCurrentSession(s); setPage('session-detail'); }}>
              <div className="session-info">
                <div className="session-role">{s.job_role}</div>

// ── Upload Resume ─────────────────────────────────────────────────────────────
function UploadPage({ token, toast, setPage }) {
  const [file, setFile] = useState(null);
  const [drag, setDrag] = useState(false);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const fileRef = useRef();

  const handleFile = (f) => {
    if (!f) return;
    if (!['application/pdf','application/vnd.openxmlformats-officedocument.wordprocessingml.document'].includes(f.type) && !f.name.match(/\.(pdf|docx)$/i)) {
      toast('Only PDF and DOCX files are supported', 'error'); return;
    }
    setFile(f);
  };

  const upload = async () => {
    if (!file) return;
    setLoading(true);
    try {
      const fd = new FormData(); fd.append('file', file);
      const data = await api.upload('/resume/upload', fd, token);
      setResult(data);
      toast('Resume parsed successfully!', 'success');
    } catch(e) { toast(e.message, 'error'); } finally { setLoading(false); }
  };

  return (
    <div className="page" style={{maxWidth:'750px'}}>
      <div className="section-header">
        <div>
          <div className="section-title">Upload Resume</div>
          <div className="section-sub">AI will parse and extract your skills, experience & education</div>
        </div>
      </div>

      {!result ? (
        <>
          <div
            className={`upload-zone ${drag?'drag-over':''}`}
            onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}}
            onDragOver={e=>{e.preventDefault();setDrag(true);}}
            onDragLeave={()=>setDrag(false)}
            onClick={()=>fileRef.current?.click()}
          >
            <div className="upload-icon">{file ? '📄' : '📂'}</div>
            {file ? (
              <>
                <h3>{file.name}</h3>
                <p style={{color:'var(--success)'}}>Ready to upload — {(file.size/1024/1024).toFixed(2)} MB</p>
              </>
            ) : (
              <>
                <h3>Drop your resume here</h3>
                <p>PDF or DOCX — click to browse</p>
              </>
            )}
            <input ref={fileRef} type="file" accept=".pdf,.docx" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
          </div>

          {file && (
            <button className="btn-primary w-full mt-2" style={{padding:'13px', fontSize:'0.95rem'}} onClick={upload} disabled={loading}>
              {loading ? <><span className="spinner"/>{' Parsing...'}</> : '🚀 Upload & Parse Resume'}
            </button>
          )}
        </>
      ) : (
        <div>
          <div className="alert alert-success mb-2">Resume uploaded and parsed successfully!</div>
          <div className="card mb-2">
            <h3 style={{fontWeight:'700', marginBottom:'1.25rem'}}>Extracted Information</h3>
            <div className="grid-2">
              <div>
                <div className="form-label">Name</div>
                <div style={{fontWeight:'600'}}>{result.parsed_data?.full_name || '—'}</div>
              </div>
              <div>
                <div className="form-label">Email</div>
                <div style={{fontWeight:'600'}}>{result.parsed_data?.email || '—'}</div>
              </div>
            </div>
            <div className="mt-2">
              <div className="form-label">Skills Detected ({result.parsed_data?.skills?.length || 0})</div>
              <div style={{display:'flex', flexWrap:'wrap', gap:'0.5rem', marginTop:'0.5rem'}}>
                {(result.parsed_data?.skills || []).slice(0,20).map((s,i)=>(
                  <span key={i} style={{background:'rgba(99,102,241,0.12)', border:'1px solid rgba(99,102,241,0.2)', borderRadius:'100px', padding:'3px 12px', fontSize:'0.8rem', color:'var(--primary-light)'}}>{s}</span>
                ))}
              </div>
            </div>
            {result.parsed_data?.experience?.length > 0 && (
              <div className="mt-2">
                <div className="form-label">Experience</div>
                {result.parsed_data.experience.slice(0,3).map((e,i)=>(
                  <div key={i} style={{background:'var(--bg3)', borderRadius:'8px', padding:'10px 14px', marginTop:'0.5rem', fontSize:'0.875rem'}}>
                    <strong>{e.title}</strong> at {e.company} <span style={{color:'var(--text-muted)'}}>({e.duration})</span>
                  </div>
                ))}
              </div>
            )}
          </div>
          <div style={{display:'flex', gap:'1rem'}}>
            <button className="btn-primary" style={{flex:1, padding:'12px'}} onClick={() => setPage('new-session')}>Start Interview with This Resume →</button>
            <button className="btn-secondary" onClick={() => { setFile(null); setResult(null); }}>Upload Another</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── New Session ───────────────────────────────────────────────────────────────
function NewSessionPage({ token, toast, setPage, setCurrentSession }) {
  const [resumes, setResumes] = useState([]);
  const [form, setForm] = useState({ resume_id: '', job_role: '', job_description: '', num_questions: 5 });
  const [loading, setLoading] = useState(false);
  const [fetchingResumes, setFetchingResumes] = useState(true);

  const roles = ['Software Engineer', 'Backend Engineer', 'Frontend Engineer', 'Data Scientist', 'Product Manager', 'DevOps Engineer', 'ML Engineer', 'Full Stack Developer', 'Android Developer', 'iOS Developer'];

  useEffect(() => {
    api.get('/resume/', token)
      .then(data => { setResumes(Array.isArray(data) ? data : []); })
      .catch(() => setResumes([]))
      .finally(() => setFetchingResumes(false));
  }, [token]);

  const submit = async (e) => {
    e.preventDefault();
    if (!form.resume_id) { toast('Please select a resume', 'error'); return; }
    setLoading(true);
    try {
      const session = await api.post('/interview/sessions', {
        resume_id: form.resume_id,
        job_role: form.job_role,
        job_description: form.job_description,
        total_questions: parseInt(form.num_questions),
      }, token);
      // Normalize: POST returns session_id, but InterviewPage expects .id
      setCurrentSession({ ...session, id: session.session_id });
      toast('Session created! Questions generated by AI.', 'success');
      setPage('interview');
    } catch(e) { toast(e.message, 'error'); } finally { setLoading(false); }
  };

  return (
    <div className="page" style={{maxWidth:'650px'}}>
      <div className="section-header">
        <div>
          <div className="section-title">New Interview Session</div>
          <div className="section-sub">AI will generate unique questions tailored to your resume</div>
        </div>
      </div>
      <div className="card">
        <form onSubmit={submit}>
          <div className="form-group">
            <label className="form-label">Select Resume</label>
            {fetchingResumes ? (
              <div className="skeleton" style={{height:'42px', borderRadius:'10px'}}/>
            ) : resumes.length === 0 ? (
              <div className="alert alert-info">
                No resumes found. <button style={{color:'var(--primary-light)', background:'none', border:'none', cursor:'pointer', fontWeight:'600'}} onClick={() => setPage('upload')}>Upload one first →</button>
              </div>
            ) : (
              <select className="form-select" value={form.resume_id} onChange={e => setForm(p=>({...p, resume_id:e.target.value}))} required>
                <option value="">-- Select your resume --</option>
                {resumes.map(r => <option key={r.id} value={r.id}>{r.filename} — {r.parsed_data?.full_name || 'Unknown'}</option>)}
              </select>
            )}
          </div>
          <div className="form-group">
            <label className="form-label">Job Role</label>
            <select className="form-select" value={form.job_role} onChange={e => setForm(p=>({...p, job_role:e.target.value}))} required>
              <option value="">-- Select role --</option>
              {roles.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Job Description <span style={{color:'var(--text-faint)', fontWeight:'400'}}>(optional — improves question quality)</span></label>
            <textarea className="form-input" rows={4} placeholder="Paste the job description here for more targeted questions..."
              value={form.job_description} onChange={e => setForm(p=>({...p, job_description:e.target.value}))}
              style={{resize:'vertical'}}/>
          </div>
          <div className="form-group">
            <label className="form-label">Number of Questions</label>
            <div style={{display:'flex', gap:'0.75rem', flexWrap:'wrap'}}>
              {[3, 5, 7, 10].map(n => (
                <button key={n} type="button" style={{
                  padding:'8px 20px', borderRadius:'8px', border:'1px solid',
                  background: form.num_questions===n ? 'var(--primary)' : 'var(--card)',
                  borderColor: form.num_questions===n ? 'var(--primary)' : 'var(--border)',
                  color: form.num_questions===n ? 'white' : 'var(--text-muted)',
                  cursor:'pointer', fontWeight:'600', fontFamily:'inherit',
                }} onClick={() => setForm(p=>({...p, num_questions:n}))}>
                  {n}
                </button>
              ))}
            </div>
          </div>
          <div className="alert alert-info mt-2">
            <strong>How it works:</strong> AI reads your resume + role, generates {form.num_questions} unique questions, converts them to speech. You record voice answers — Whisper transcribes them — LLM scores each one in real time.
          </div>
          <button className="btn-primary w-full mt-2" type="submit" disabled={loading || resumes.length===0} style={{padding:'13px', fontSize:'0.95rem'}}>
            {loading ? <><span className="spinner"/>{' Generating questions with AI...'}</> : '🎙️ Start AI Interview →'}
          </button>
        </form>
      </div>
    </div>
  );
}

// ── Interview Room ─────────────────────────────────────────────────────────────
function InterviewPage({ token, session, toast, setPage }) {
  const [questions, setQuestions] = useState([]);
  const [current, setCurrent] = useState(0);
  const [recording, setRecording] = useState(false);
  const [loading, setLoading] = useState(true);
  const [submitting, setSubmitting] = useState(false);
  const [scores, setScores] = useState({});
  const [cameraOn, setCameraOn] = useState(false);
  const [phase, setPhase] = useState('ready'); // ready | interviewing | complete
  const [transcript, setTranscript] = useState('');
  // ── Adaptive follow-up state ────────────────────────────────────────────────
  const [followupQuestion, setFollowupQuestion] = useState(null);  // text of follow-up
  const [isFollowup, setIsFollowup] = useState(false);             // currently on follow-up?
  const [loadingFollowup, setLoadingFollowup] = useState(false);
  // ───────────────────────────────────────────────────────────────────────────
  const videoRef = useRef();
  const mediaRecorderRef = useRef();
  const chunksRef = useRef([]);
  const streamRef = useRef();

  useEffect(() => {
    if (!session) return;
    const sid = session.id || session.session_id;
    api.get(`/interview/sessions/${sid}/questions`, token)
      .then(qs => { setQuestions(qs); setLoading(false); })
      .catch(() => toast('Could not load questions', 'error'));
  }, [session, token]);

  const startCamera = async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      streamRef.current = s;
      setCameraOn(true);
      // srcObject is set by the useEffect below after the video element renders
    } catch { toast('Camera access denied — continuing without video', 'info'); }
  };

  // Attach camera stream to video element after it appears in DOM
  useEffect(() => {
    if (cameraOn && videoRef.current && streamRef.current) {
      videoRef.current.srcObject = streamRef.current;
    }
  }, [cameraOn]);

  const stopCamera = () => {
    streamRef.current?.getTracks().forEach(t => t.stop());
    setCameraOn(false);
  };

  useEffect(() => () => stopCamera(), []);

  const startRecording = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunksRef.current = [];
      const mr = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      mr.ondataavailable = e => chunksRef.current.push(e.data);
      mr.start();
      mediaRecorderRef.current = mr;
      setRecording(true);
      setTranscript('');
    } catch { toast('Microphone access required to record answer', 'error'); }
  };

  const stopRecording = () => {
    return new Promise(resolve => {
      const mr = mediaRecorderRef.current;
      if (!mr) return resolve(null);
      mr.onstop = () => {
        const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
        resolve(blob);
      };
      mr.stop();
      mr.stream.getTracks().forEach(t => t.stop());
      setRecording(false);
    });
  };

  const submitAnswer = async () => {
    setSubmitting(true);
    try {
      const blob = await stopRecording();
      if (!blob || blob.size < 100) { toast('No audio recorded. Please try again.', 'error'); setSubmitting(false); return; }

      // Transcribe
      const fd = new FormData();
      fd.append('file', blob, 'answer.webm');
      toast('Transcribing your answer...', 'info');
      const txResult = await api.upload('/voice/transcribe', fd, token);
      const tx = txResult.text || '';
      setTranscript(tx);

      // Score
      toast('AI is scoring your answer...', 'info');
      if (!tx || tx.trim().length < 5) {
        toast('Transcription was empty — please speak clearly and try again', 'error');
        setSubmitting(false); return;
      }

      const sid = session.id || session.session_id;
      const qid = isFollowup ? questions[current].id : questions[current].id;

      const scoreResult = await api.post('/scoring/score-answer', {
        session_id: sid,
        question_id: qid,
        transcript: tx,
      }, token).catch(() => ({ overall_score: null, feedback: 'Scoring unavailable — check API key' }));

      setScores(p => ({ ...p, [isFollowup ? `${current}-followup` : current]: { ...scoreResult, transcript: tx, isFollowup } }));
      const scoreVal = scoreResult.overall_score;
      toast(scoreVal !== null && scoreVal !== undefined
        ? `Answer scored: ${scoreVal.toFixed(1)}/10`
        : 'Answer scored!', 'success');

      // ── Adaptive follow-up logic ──────────────────────────────────────────
      const FOLLOWUP_THRESHOLD = 5.0; // fresher mode: only follow up on clearly weak answers
      const needsFollowup = !isFollowup &&
        scoreResult.overall_score !== null &&
        scoreResult.overall_score < FOLLOWUP_THRESHOLD;

      if (needsFollowup) {
        // Score was low — generate a targeted follow-up question
        setIsFollowup(true);
        setLoadingFollowup(true);
        setTranscript('');
        toast(`Score was ${scoreResult.overall_score?.toFixed(1)}/10 — generating follow-up question...`, 'info');
        try {
          const fq = await api.post(`/interview/sessions/${sid}/followup`, {
            question_id: questions[current].id,
            overall_score: scoreResult.overall_score,
            accuracy_score: scoreResult.accuracy_score || 5,
            clarity_score: scoreResult.clarity_score || 5,
            depth_score: scoreResult.depth_score || 5,
            relevance_score: scoreResult.relevance_score || 5,
            candidate_answer: tx,
          }, token);
          setFollowupQuestion(fq.followup_text);
          toast('Follow-up question ready — answer it to improve your score!', 'info');
        } catch(e) {
          toast('Could not generate follow-up — moving to next question', 'info');
          setIsFollowup(false);
          moveToNextQuestion(current, questions);
        } finally {
          setLoadingFollowup(false);
        }
      } else {
        // Good score OR already on a follow-up — move to next main question
        setIsFollowup(false);
        setFollowupQuestion(null);
        moveToNextQuestion(current, questions);
      }
      // ──────────────────────────────────────────────────────────────────────
    } catch(e) { toast(e.message, 'error'); } finally { setSubmitting(false); }
  };

  const moveToNextQuestion = (cur, qs) => {
    if (cur < qs.length - 1) {
      setTimeout(() => { setCurrent(p => p + 1); setTranscript(''); }, 800);
    } else {
      completeInterview();
    }
  };

  const completeInterview = async () => {
    setPhase('complete');
    toast('Interview complete! Generating scorecard...', 'success');
    const sid = session.id || session.session_id;
    await api.post(`/interview/sessions/${sid}/complete`, {}, token).catch(() => {});
  };

  const scoreColor = (s) => {
    if (s === null || s === undefined) return 'var(--text-muted)';
    if (s >= 8) return '#10b981'; if (s >= 6) return '#f59e0b'; return '#ef4444';
  };
  const scoreBarColor = (s) => {
    if (!s) return 'var(--text-faint)'; if (s>=8) return '#10b981'; if (s>=6) return '#f59e0b'; return '#ef4444';
  };

  if (loading) return <div className="page"><div style={{textAlign:'center', paddingTop:'5rem'}}><div className="spinner" style={{width:'40px', height:'40px', margin:'0 auto'}}/>  <p className="text-muted mt-2">Loading your personalized questions...</p></div></div>;

  if (phase === 'complete') return (
    <div className="page" style={{maxWidth:'700px', textAlign:'center'}}>
      <div style={{fontSize:'5rem', marginBottom:'1.5rem', animation:'fadeInDown 0.5s ease'}}>🎉</div>
      <h1 style={{fontSize:'2rem', fontWeight:'900', marginBottom:'1rem'}}>Interview Complete!</h1>
      <p className="text-muted mb-2">Great job! Your scorecard is being generated and will be emailed to you.</p>
      <div className="card mb-2">
        <h3 style={{fontWeight:'700', marginBottom:'1.25rem'}}>Session Summary</h3>
        {questions.map((q, i) => scores[i] && (
          <div key={i} style={{background:'var(--bg3)', borderRadius:'10px', padding:'1rem', marginBottom:'0.75rem', textAlign:'left'}}>
            <div style={{fontSize:'0.8rem', color:'var(--primary-light)', fontWeight:'700', marginBottom:'0.5rem'}}>Q{i+1}: {q.question_text.substring(0,80)}...</div>
            <div style={{display:'flex', gap:'1rem', flexWrap:'wrap'}}>
              {['accuracy', 'clarity', 'depth', 'relevance'].map(d => scores[i][`${d}_score`] !== undefined && (
                <div key={d} style={{textAlign:'center'}}>
                  <div style={{fontSize:'1.2rem', fontWeight:'800', color: scoreColor(scores[i][`${d}_score`])}}>{scores[i][`${d}_score`]?.toFixed(1)}</div>
                  <div style={{fontSize:'0.7rem', color:'var(--text-muted)', textTransform:'uppercase'}}>{d}</div>
                </div>
              ))}
              <div style={{textAlign:'center', marginLeft:'auto'}}>
                <div style={{fontSize:'1.4rem', fontWeight:'900', color: scoreColor(scores[i]?.overall_score)}}>{scores[i]?.overall_score?.toFixed(1)}</div>
                <div style={{fontSize:'0.7rem', color:'var(--text-muted)', textTransform:'uppercase'}}>Overall</div>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div style={{display:'flex', gap:'1rem', justifyContent:'center'}}>
        <button className="btn-primary" style={{padding:'12px 24px'}} onClick={() => setPage('dashboard')}>Go to Dashboard</button>
        <button className="btn-secondary" onClick={() => setPage('new-session')}>New Interview</button>
      </div>
    </div>
  );

  const q = questions[current];
  const currentScore = scores[current];
  const progress = ((current) / questions.length) * 100;

  return (
    <div style={{padding:'1.5rem', maxWidth:'1400px', margin:'0 auto'}}>
      {/* Progress bar */}
      <div style={{marginBottom:'1.5rem'}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'0.75rem'}}>
          <div>
            <span style={{fontWeight:'700', fontSize:'1.1rem'}}>{session?.job_role}</span>
            <span style={{color:'var(--text-muted)', marginLeft:'0.75rem', fontSize:'0.875rem'}}>Question {current+1} of {questions.length}</span>
          </div>
          <div style={{display:'flex', gap:'0.75rem', alignItems:'center'}}>
            <button className={cameraOn ? 'btn-danger' : 'btn-secondary'} style={{padding:'7px 14px', fontSize:'0.8rem'}} onClick={cameraOn ? stopCamera : startCamera}>
              {cameraOn ? '📷 Camera Off' : '📷 Camera On'}
            </button>
            <button className="btn-secondary" style={{padding:'7px 14px', fontSize:'0.8rem', color:'var(--error)'}} onClick={() => setPage('dashboard')}>Exit</button>
          </div>
        </div>
        <div className="progress">
          <div className="progress-bar" style={{width:`${progress}%`}}/>
        </div>
      </div>

      <div className="interview-layout">
        <div className="interview-main">
          {/* Camera — video always in DOM so ref is never null */}
          <div className="camera-box" style={{maxHeight:'220px'}}>
            <video ref={videoRef} className="camera-video" autoPlay muted playsInline
                   style={{display: cameraOn ? 'block' : 'none'}}/>
            {cameraOn && (
              <div className="camera-overlay">
                <div className="camera-label"><span className="rec-dot"/>{recording ? 'Recording' : 'Live'}</div>
              </div>
            )}
            {!cameraOn && (
              <div className="camera-off">
                <span>📷</span>
                <p style={{fontSize:'0.875rem'}}>Camera off — click "Camera On" to enable</p>
              </div>
            )}
          </div>

          {/* Question */}
          <div className="question-box">
            <div className="question-num">Question {current + 1} of {questions.length}</div>

            {/* Follow-up badge + question OR regular question */}
            {loadingFollowup ? (
              <div style={{textAlign:'center', padding:'2rem', color:'var(--text-muted)'}}>
                <div style={{fontSize:'1.5rem', marginBottom:'0.5rem'}}>🤔</div>
                <p>Generating follow-up question based on your answer...</p>
              </div>
            ) : isFollowup && followupQuestion ? (
              <>
                <div style={{
                  display:'inline-flex', alignItems:'center', gap:'0.5rem',
                  background:'rgba(245,158,11,0.15)', color:'#fcd34d',
                  border:'1px solid rgba(245,158,11,0.3)',
                  borderRadius:'20px', padding:'4px 14px',
                  fontSize:'0.78rem', fontWeight:'700', marginBottom:'0.75rem'
                }}>
                  🔄 FOLLOW-UP — Score was low, dig deeper!
                </div>
                <div className="question-text">{followupQuestion}</div>
                <div style={{marginTop:'0.5rem', fontSize:'0.8rem', color:'var(--text-muted)'}}>
                  💡 Address the specific gaps in your previous answer to improve your score
                </div>
              </>
            ) : (
              <>
                <div className="question-text">{q?.question_text}</div>
                {q?.question_type && (
                  <div style={{marginTop:'1rem', display:'flex', gap:'0.75rem', flexWrap:'wrap'}}>
                    <span className="question-type-badge">{q.question_type}</span>
                    {q.difficulty && <span className="question-type-badge" style={{background:'rgba(245,158,11,0.1)', color:'#fcd34d', borderColor:'rgba(245,158,11,0.2)'}}>{q.difficulty}</span>}
                  </div>
                )}
              </>
            )}

            {transcript && (
              <div style={{marginTop:'1.25rem', background:'var(--bg3)', borderRadius:'10px', padding:'1rem', borderLeft:'3px solid var(--primary)'}}>
                <div style={{fontSize:'0.75rem', color:'var(--primary-light)', fontWeight:'700', marginBottom:'0.4rem', textTransform:'uppercase'}}>Your Answer (Transcribed)</div>
                <p style={{fontSize:'0.9rem', color:'var(--text-muted)', lineHeight:'1.6'}}>{transcript}</p>
              </div>
            )}
          </div>

          {/* Controls */}
          <div className="record-controls">
            <button className={`record-btn ${recording ? 'recording' : 'idle'}`}
              onClick={recording ? () => {} : startRecording}
              disabled={submitting || loadingFollowup}>
              {recording ? '⏹' : '🎙️'}
            </button>
            <div className="record-info">
              <div className="record-status">
                {loadingFollowup ? 'Generating follow-up question...' :
                 submitting ? 'Processing answer...' :
                 recording ? 'Recording... speak your answer' : 'Ready to record'}
              </div>
              <div className="record-hint">
                {loadingFollowup ? 'Please wait...' :
                 recording ? 'Click Submit when done' : 'Click the mic button to start recording'}
              </div>
            </div>
            {recording && (
              <button className="btn-primary" onClick={submitAnswer} disabled={submitting} style={{padding:'10px 20px'}}>
                {submitting ? <span className="spinner"/> : 'Submit →'}
              </button>
            )}
          </div>
        </div>

        {/* Sidebar */}
        <div className="interview-sidebar">
          {currentScore && (
            <div className="score-card-sm">
              <h4>Last Answer Score</h4>
              {[
                ['Accuracy', currentScore.accuracy_score],
                ['Clarity', currentScore.clarity_score],
                ['Depth', currentScore.depth_score],
                ['Relevance', currentScore.relevance_score],
              ].map(([label, val]) => (
                <div key={label}>
                  <div className="score-row">
                    <span className="score-label">{label}</span>
                    <span className="score-val" style={{color: scoreColor(val)}}>{val?.toFixed(1) ?? '—'}</span>
                  </div>
                  <div className="score-bar" style={{marginBottom:'0.75rem'}}>
                    <div className="score-bar-fill" style={{width:`${(val||0)*10}%`, background: scoreBarColor(val)}}/>
                  </div>
                </div>
              ))}
              <div style={{borderTop:'1px solid var(--border)', paddingTop:'0.75rem', marginTop:'0.25rem'}}>
                <div className="score-row">
                  <span style={{fontWeight:'700'}}>Overall</span>
                  <span style={{fontSize:'1.3rem', fontWeight:'900', color: scoreColor(currentScore.overall_score)}}>{currentScore.overall_score?.toFixed(1)}</span>
                </div>
              </div>
              {currentScore.feedback && (
                <p style={{fontSize:'0.8rem', color:'var(--text-muted)', lineHeight:'1.6', marginTop:'0.75rem', fontStyle:'italic'}}>"{currentScore.feedback}"</p>
              )}
            </div>
          )}

          <div className="score-card-sm">
            <h4>Question Progress</h4>
            {questions.map((_, i) => (
              <div key={i} style={{display:'flex', alignItems:'center', gap:'0.75rem', marginBottom:'0.5rem'}}>
                <div style={{
                  width:'28px', height:'28px', borderRadius:'50%', flexShrink:0,
                  display:'flex', alignItems:'center', justifyContent:'center',
                  fontSize:'0.75rem', fontWeight:'700',
                  background: i < current ? (scores[i]?.overall_score >= 6 ? 'rgba(16,185,129,0.2)' : 'rgba(239,68,68,0.2)') : i === current ? 'rgba(99,102,241,0.2)' : 'var(--bg3)',
                  color: i < current ? (scores[i]?.overall_score >= 6 ? '#10b981' : '#ef4444') : i === current ? 'var(--primary-light)' : 'var(--text-faint)',
                  border: `1px solid ${i === current ? 'var(--primary)' : 'transparent'}`,
                }}>
                  {i < current ? (scores[i]?.overall_score >= 6 ? '✓' : '✗') : i+1}
                </div>
                <div style={{flex:1, fontSize:'0.8rem', color: i === current ? 'var(--text)' : 'var(--text-muted)', fontWeight: i===current?'600':'400'}}>
                  {questions[i]?.question_text?.substring(0, 45)}...
                </div>
                {scores[i] && <span style={{fontSize:'0.8rem', fontWeight:'700', color: scoreColor(scores[i].overall_score)}}>{scores[i].overall_score?.toFixed(1)}</span>}
              </div>
            ))}
          </div>

          <div className="score-card-sm" style={{background:'rgba(99,102,241,0.05)', borderColor:'rgba(99,102,241,0.2)'}}>
            <h4 style={{color:'var(--primary-light)'}}>Tips</h4>
            <ul style={{fontSize:'0.8rem', color:'var(--text-muted)', paddingLeft:'1rem', lineHeight:'1.8'}}>
              <li>Use the STAR method for behavioral questions</li>
              <li>Be specific — mention technologies & metrics</li>
              <li>Speak clearly and at a natural pace</li>
              <li>Aim for 2–3 minutes per answer</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState('home');
  const [user, setUser] = useState(() => { try { return JSON.parse(localStorage.getItem('ai_user')); } catch { return null; } });
  const [token, setToken] = useState(() => localStorage.getItem('ai_token') || '');
  const [currentSession, setCurrentSession] = useState(null);
  const { toasts, add: toast, remove, clear: clearToasts } = useToast();

  // Clear stale toasts on every page transition
  const navigate = useCallback((p) => { clearToasts(); setPage(p); }, [clearToasts]);

  const onLogin = (u, t) => {
    setUser(u); setToken(t);
    localStorage.setItem('ai_user', JSON.stringify(u));
    localStorage.setItem('ai_token', t);
    clearToasts();
    setPage('dashboard');
  };
  const onLogout = () => {
    setUser(null); setToken('');
    localStorage.removeItem('ai_user'); localStorage.removeItem('ai_token');
    clearToasts();
    setPage('home');
  };

  const renderPage = () => {
    if (!user && ['dashboard','upload','new-session','interview','session-detail'].includes(page)) {
      return <LoginPage setPage={navigate} onLogin={onLogin} toast={toast}/>;
    }
    switch(page) {
      case 'home': return <HomePage setPage={navigate}/>;
      case 'login': return <LoginPage setPage={navigate} onLogin={onLogin} toast={toast}/>;
      case 'register': return <RegisterPage setPage={navigate} onLogin={onLogin} toast={toast}/>;
      case 'dashboard': return <DashboardPage token={token} setPage={navigate} setCurrentSession={setCurrentSession} toast={toast}/>;
      case 'upload': return <UploadPage token={token} toast={toast} setPage={navigate}/>;
      case 'new-session': return <NewSessionPage token={token} toast={toast} setPage={navigate} setCurrentSession={setCurrentSession}/>;
      case 'interview': return <InterviewPage token={token} session={currentSession} toast={toast} setPage={navigate}/>;
      default: return <HomePage setPage={navigate}/>;
    }
  };

  return (
    <>
      <Navbar page={page} setPage={navigate} user={user} onLogout={onLogout}/>
      <div style={{animation:'fadeInUp 0.4s ease'}}>
        {renderPage()}
      </div>
      <ToastContainer toasts={toasts} remove={remove}/>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
